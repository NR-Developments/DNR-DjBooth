<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="script.js"></script>
        <title>DNR-DJ Console</title>
    </head>
    <body>
        <!-- DNR-DJ LOGO HERO -->
        <div id="dnr-logo-hero">
            <img id="dnr-logo-img" src="logo.png" alt="DNR-DJ">
            <div id="dnr-logo-text">
                <p class="dnr-title">DNR-DJ</p>
                <p class="dnr-sub">Digital Nightlife Reactor</p>
            </div>
        </div>

        <img id="backgroundWallpaper" src="img/djpult.png" alt="Check img-folder!">
        
        <div id="console">
            <p id="currentPlaying">Currently playing:</p>
            <div id="screen">
                <p id="currentSong"></p>
            </div>
            <div id="timeLineOutside">
                <div id="timeLineInside"></div>
            </div>
            <p id="timestamp">
                <span id="currentTime">--:--</span>
                <span id="slash"> / </span>
                <span id="maxTime">--:--</span>
            </p>
            <textarea id="linkInput" rows="4" cols="50" placeholder="Insert link here..."></textarea>
        </div>
        
        <button id="addToPlaylist">Add to playlist</button>
        <button id="directPlay">Play</button>
        <div id="addPlaylist"></div>

        <div id="buttons">
            <div id="buttonOne" class="button"><button class="PlayButton"></button></div>
            <div id="buttonTwo" class="button"><i class="fas fa-undo-alt"></i></div>
            <div id="buttonThree" class="button"><i class="fas fa-redo-alt"></i></div>
            <div id="buttonFour" class="button"><i class="fas fa-volume-down"></i></div>
            <div id="buttonFive" class="button"><i class="fas fa-volume-up"></i></div>
            <div id="buttonSix" class="button"></div>
            <div id="buttonSeven" class="button"></div>
        </div>

        <div id="playlistsSpace">
            <textarea id="CreatePlaylistName" rows="1" cols="50" placeholder="Playlistname..."></textarea>
            <i id="PlayListAddButton" class="fas fa-plus"></i>
            <div class="playlist" id="songhistorySpace" data-id="songhistory">
                <button id="playlistsonghistory" class="playlistButton">Songhistory</button>
                <div id="songSpacesonghistory" class="songs" data-id="songhistory" data-displayed="0"></div>
            </div>
            <div id="playlists"></div>
        </div>
    </body>
</html>
